name: Verify

# 작업 브랜치용 검증. main은 deploy.yml이 같은 검사를 배포 «앞»에서 하므로 여기서 뺀다
# (넣으면 main 푸시마다 같은 것을 두 번 돌린다).
#
# main에만 검사가 있으면 «푸시 = 배포»인 이 리포에서는 이미 늦다. 깨진 것을 라이브에서
# 알게 되는 대신 브랜치에서 알자는 것이 이 파일의 전부다.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에 연달아 밀면 앞엣것은 볼 필요가 없다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # deploy.yml과 같은 순서·같은 명령이다. 한쪽을 고치면 다른 쪽도 고친다.
      - run: npm run worker:typecheck
      - run: npm test
      - run: npm run build
