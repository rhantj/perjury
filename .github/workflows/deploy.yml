name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포 중 새 푸시가 오면 진행 중인 것을 끝내고 최신만 반영한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 여기서 막지 않으면 깨진 것이 그대로 심사용 링크가 된다(푸시 = 배포).
      #
      # 「build만 돌리면 되지 않나」에 대한 답: build의 tsc는 루트 tsconfig만 본다.
      # workers/는 별도 tsconfig(다른 lib·types라 합칠 수도 없다)라 그 밖에 있었고,
      # 실제로 그 틈으로 장애가 나갔다 — 시야에 필드가 늘었는데 워커 스키마가 안 따라가서
      # 배포본의 판단 요청이 전부 400을 맞고 폴백으로 떨어졌다.
      # 그때 worker:typecheck는 이미 깨져 있었고, CI가 그 명령을 안 돌려서 지나갔다
      # (session-resume/2026-08-06-worker-outage-and-merge.md).
      #
      # 순서는 성능 결정이 아니다 — 셋을 합쳐도 2~3초라 npm ci에 묻힌다.
      # 없어서 장애가 난 검사를 맨 앞에 둔 것뿐이다.
      - run: npm run worker:typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 기본 10분(600000ms)으로는 모자란다. 2026-08-06에 이 값 때문에 배포가
          # 연달아 빨간불이 났는데, **배포는 실제로 성공하고 있었다** — 액션의 폴링이
          # 먼저 포기했고 GitHub 백엔드가 그 뒤에 끝냈다. 라이브 번들을 받아 로컬
          # 빌드와 바이트 비교해서 확인했다.
          #
          # 시간을 벌자는 것이 아니라 **신호를 정직하게 만들려는 것**이다.
          # 되든 안 되든 빨간불이면 진짜 실패를 구분할 수 없고, 그날 사고 셋이 전부
          # 「배포됐다고 믿었는데 아니었다」에서 나왔다
          # (session-resume/2026-08-06-ci-gate-and-deploy-jam.md).
          timeout: 1200000
