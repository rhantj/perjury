name = "perjury-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-03"

# account_id를 적지 않는다. 로그인한 계정에서 추론되므로,
# 팀원이 각자 자기 계정으로 배포해도 이 파일을 고칠 필요가 없다.

# 일일 총 호출 상한. 재배포 없이 조정하려고 환경변수로 둔다(설계 §8.6).
#
# **400은 임의로 고른 값이 아니라 천장이다.** chargeCall이 요청당 KV에 두 번 쓰고
# (전체 카운터 + IP 카운터) 무료 티어 쓰기가 1,000회/일이라, 그 위로 올리면
# 카운터가 멈춰 캡이 캡 노릇을 못 한다. 더 늘리려면 유료 KV거나 쓰기를 줄여야 한다.
#
# 08-07에 250→400, 120→250으로 올렸다(심사 기간 대비, 천장까지).
#
# **한 판은 약 180회다.** 「약 120회」로 적혀 있던 것은 추정이었고, 실제로 세어 보니
# 사람이 앉은 판에서 평균 180회였다(제안 20 · 반증 40 · 이의제기 120). 라운드 24 기준.
# 옛 IP 캡 120으로는 **한 판을 절반도 못 돌고 폴백으로 떨어졌다.**
#
# 지금 값이 뜻하는 것 — 한 사람 1판, 전체 하루 2판. 천장이 400이라 더는 못 올린다.
#
# **늘리는 진짜 수단은 캡이 아니라 §2-4다.** 이의제기 120회는 매 라운드 AI 5좌석에게
# 전부 묻기 때문인데, 룰 개편 §2-4는 이의제기를 «제안자 전용»으로 바꾼다.
# 넣으면 판당 180 → 약 66회가 되어 같은 천장에서 하루 6판이 된다. 아직 미구현이다.
[vars]
DAILY_CALL_CAP = "400"
IP_DAILY_CALL_CAP = "250"

# 운영 모델. 2026-08-03 비용·품질 실측 후 결정 — docs/decisions/003-운영-llm-모델.md
LLM_MODEL = "claude-sonnet-5"

# 여기 없는 값 둘 — 시크릿으로만 넣는다(`wrangler secret put`).
#   LLM_API_KEY   Anthropic 키. 이 워커가 존재하는 이유다.
#   LLM_BASE_URL  Cloudflare AI Gateway 주소. Anthropic이 Workers 출구를 막아서 거쳐 간다.
#                 인증 없는 게이트웨이라 public 리포에 두지 않는다 — docs/decisions/004

# 호출 카운터. Workers는 상태가 없으므로 밖에 둔다.
# id는 비밀이 아니다 — 이 네임스페이스는 계정 인증 없이 읽고 쓸 수 없다.
[[kv_namespaces]]
binding = "BUDGET"
id = "5278dc63190845b28fbe0072602d18ac"
